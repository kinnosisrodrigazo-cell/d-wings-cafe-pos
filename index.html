let cart = [];
let isSavingSale = false;
let saleSaved = false;
let pendingSaleRef = null;
  
const wingFlavors = [
  "CHEESE BLIZZ",
  "LEMON PEPPER",
  "ORANGE ZEST",
  "PARMESAN",
  "SALTED EGG",
  "TERIYAKI",
  "SWEET SOY",
  "HONEY BUTTER",
  "PLAIN",
  "HONEY SRIRACHA",
  "MANGO HABANERO",
  "YANGNYEOM",
  "SPICY HONEY GLAZED",
  "BUFFALO",
  "CHILI CHEESE"
];

let pendingProduct = null;
let pendingRequiredFlavors = null;
let pendingIncludedItems = [];
let pendingRequiresDip = false;
let editingCartIndex = null;

const peso = n => "₱" + n.toFixed(2);
function getTodayDate(){
  return new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Manila",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).format(new Date());
}
let selectedCategory = "Wings";

function renderProducts(){

 const categories = [
  "Wings",
  "Fries",
  "Floats",
  "Drinks",
  "Extras",
  "Sandwich",
  "Chicken Burger"
];

  document.getElementById("categoryTabs").innerHTML =
    categories.map(category => `
      <button
        class="category-btn ${selectedCategory === category ? "active" : ""}"
        data-category="${category}">
        ${category}
      </button>
    `).join("");

  document.querySelectorAll(".category-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      selectedCategory = btn.dataset.category;
      renderProducts();
    });
  });

const filteredProducts = menu.filter(
  p => p.category === selectedCategory
);

  document.getElementById("products").innerHTML =
    filteredProducts.map(p => {
      const index = menu.indexOf(p);

      return `
        <button class="product" data-index="${index}">
          <strong>${p.name}</strong>
          <span class="price">${peso(p.price)}</span>
        </button>
      `;
    }).join("");

  document.querySelectorAll(".product").forEach(btn=>{
    btn.addEventListener("click",()=>{
      addItem(Number(btn.dataset.index));
    });
  });
}

function addItem(index){
  const product = menu[index];

  if(product.category === "Wings"){
    pendingProduct = {...product, menuIndex:index};

    const match = product.name.match(/^(\d+)PCS/);

    pendingRequiredFlavors = match
      ? Number(match[1]) / 3
      : null;

    pendingIncludedItems = [];
    pendingRequiresDip = false;

    if(product.name.includes("+ RICE + DIP")){
      pendingIncludedItems = ["RICE"];
      pendingRequiresDip = true;
    }

   if(product.name === "UNLI 269 WINGS"){
  pendingIncludedItems = ["UNLIMITED RICE"];
  pendingRequiresDip = false;
}

if(product.name === "UNLI 299 WINGS"){
  pendingIncludedItems = [
    "UNLIMITED RICE",
    "UNLIMITED FRIES",
    "UNLIMITED DRINKS"
  ];
  pendingRequiresDip = false;
}

    document.getElementById("flavorTitle").textContent =
      product.name;

    document.getElementById("flavorInstruction").textContent =
      pendingRequiredFlavors
        ? `SELECT EXACTLY ${pendingRequiredFlavors} FLAVOR(S). EACH FLAVOR = 3 PIECES.`
        : "SELECT ANY OR ALL 15 FLAVORS.";

    const includedSection =
      document.getElementById("includedSection");

    includedSection.classList.toggle(
      "hidden",
      pendingIncludedItems.length === 0
    );

    document.getElementById("includedOptions").innerHTML =
      pendingIncludedItems.map(item => `
        <label class="flavor-option">
          <input type="checkbox" checked disabled>
          <span>${item}</span>
        </label>
      `).join("");

    document.getElementById("dipSection").classList.toggle(
      "hidden",
      !pendingRequiresDip
    );

    document.getElementById("dipChoice").value = "";

    document.getElementById("flavorOptions").innerHTML =
      wingFlavors.map(flavor => `
        <label class="flavor-option">
          <input type="checkbox" name="wingFlavor" value="${flavor}">
          <span>${flavor}</span>
        </label>
      `).join("");

    document.getElementById("flavorMessage").textContent =
      pendingRequiredFlavors
        ? `Select ${pendingRequiredFlavors} flavor(s).`
        : "Select at least one flavor.";

    document.getElementById("confirmFlavor").disabled = true;

    document.getElementById("flavorModal").classList.remove("hidden");

    document.querySelectorAll('input[name="wingFlavor"]').forEach(box=>{
      box.addEventListener("change", updateFlavorSelection);
    });

    document.getElementById("dipChoice").onchange =
      updateFlavorSelection;

    return;
  }

  const found = cart.find(x=>x.name===product.name && !x.flavors);

  if(found) found.qty++;
  else cart.push({...product, menuIndex:index, qty:1});

  renderCart();
}

function updateFlavorSelection(){
  const selected = document.querySelectorAll(
    'input[name="wingFlavor"]:checked'
  ).length;

  document.querySelectorAll('input[name="wingFlavor"]').forEach(box=>{
    box.disabled =
      pendingRequiredFlavors !== null &&
      selected >= pendingRequiredFlavors &&
      !box.checked;
  });

  const flavorValid = pendingRequiredFlavors === null
    ? selected >= 1
    : selected === pendingRequiredFlavors;

  const dipValid = !pendingRequiresDip ||
    document.getElementById("dipChoice").value !== "";

  document.getElementById("confirmFlavor").disabled =
    !flavorValid || !dipValid;

  let message = pendingRequiredFlavors
    ? `${selected} of ${pendingRequiredFlavors} flavors selected.`
    : `${selected} flavor(s) selected.`;

  if(pendingRequiresDip && !dipValid){
    message += " Please select one dip.";
  }

  document.getElementById("flavorMessage").textContent = message;
}

document.getElementById("confirmFlavor").onclick = ()=>{
  const selectedFlavors = [
    ...document.querySelectorAll('input[name="wingFlavor"]:checked')
  ].map(box=>box.value);

  const valid = pendingRequiredFlavors === null
    ? selectedFlavors.length >= 1
    : selectedFlavors.length === pendingRequiredFlavors;

  const selectedDip = document.getElementById("dipChoice").value;

  if(!valid) return;
  if(pendingRequiresDip && !selectedDip) return;

    const updatedItem = {
    ...pendingProduct,
    flavors:selectedFlavors,
    includedItems:[...pendingIncludedItems],
    dip:selectedDip || null
  };

  if(editingCartIndex !== null){
    cart[editingCartIndex] = updatedItem;
  } else {
    cart.push({
      ...updatedItem,
      qty:1
    });
  }

   document.getElementById("flavorModal").classList.add("hidden");

  editingCartIndex = null;

  document.getElementById("confirmFlavor").textContent =
    "CONFIRM FLAVORS";

  pendingProduct = null;
  pendingRequiredFlavors = null;
  pendingIncludedItems = [];
  pendingRequiresDip = false;

  renderCart();
};

document.getElementById("cancelFlavor").onclick = ()=>{
  document.getElementById("flavorModal").classList.add("hidden");

  editingCartIndex = null;

  document.getElementById("confirmFlavor").textContent =
    "CONFIRM FLAVORS";

  pendingProduct = null;
  pendingRequiredFlavors = null;
  pendingIncludedItems = [];
  pendingRequiresDip = false;
};


function renderCart(){
  const el = document.getElementById("cart");
  const discountType = document.getElementById("discount").value;

  const subtotal = cart.reduce(
    (sum, item) => sum + item.price * item.qty, 0
  );

  const eligibleSubtotal = cart
    .filter(item =>
      item.name !== "UNLI 269 WINGS" &&
      item.name !== "UNLI 299 WINGS"
    )
    .reduce((sum, item) => sum + item.price * item.qty, 0);

  const discountAmount =
    discountType !== "none" && eligibleSubtotal > 0
      ? Math.min(10, eligibleSubtotal)
      : 0;

  const total = subtotal - discountAmount;

  if(!cart.length){
    el.textContent = "No items added.";
  } else {
    el.innerHTML = cart.map((item,i)=>`
      <div class="row">
        <span>
          ${item.name}<br>
           ${item.flavors ? `
            <span class="small">
              ${item.flavors.map(flavor =>
                flavor + (item.name.startsWith("UNLI") ? "" : " (3 pcs)")
              ).join("<br>")}
            </span><br>
          ` : ""}

          ${item.includedItems?.length ? `
            <span class="small">
              Included: ${item.includedItems.join(", ")}
            </span><br>
          ` : ""}

          ${item.dip ? `
            <span class="small">
              Dip: ${item.dip}
            </span><br>
          ` : ""}
          <span class="small">${peso(item.price)} × ${item.qty}</span>
        </span>
        <span>
          ${peso(item.price * item.qty)}
${item.flavors ? `
  <button class="secondary" data-edit="${i}">EDIT</button>
  <button class="secondary" data-remove="${i}">REMOVE</button>
` : `
  <button class="secondary" data-remove="${i}">−</button>
  <button class="secondary" data-add="${i}">+</button>
`}
        </span>
      </div>
    `).join("");

    if(discountAmount > 0){
      el.innerHTML += `
        <div class="row">
          <span class="small">${discountType} DISCOUNT</span>
          <span class="small">-${peso(discountAmount)}</span>
        </div>
      `;
    }

    el.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{
      const i = Number(b.dataset.remove);

      if(cart[i].flavors){
        cart.splice(i,1);
      } else {
        cart[i].qty--;
        if(cart[i].qty <= 0) cart.splice(i,1);
      }

      renderCart();
    });

    el.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{
      cart[Number(b.dataset.add)].qty++;
      renderCart();
    });
        el.querySelectorAll("[data-edit]").forEach(b=>{
      b.onclick = ()=>{
        const index = Number(b.dataset.edit);
        const item = cart[index];

        editingCartIndex = index;
        pendingProduct = {...item};
        pendingRequiredFlavors =
          item.name.match(/^(\d+)PCS/)
            ? Number(item.name.match(/^(\d+)PCS/)[1]) / 3
            : null;

        pendingIncludedItems = [...(item.includedItems || [])];
        pendingRequiresDip = !item.name.startsWith("UNLI") &&
          (!!item.dip || item.name.includes("+ RICE + DIP"));

        document.getElementById("flavorTitle").textContent =
          "EDIT " + item.name;

        document.getElementById("flavorInstruction").textContent =
          pendingRequiredFlavors
            ? `SELECT EXACTLY ${pendingRequiredFlavors} FLAVOR(S). EACH FLAVOR = 3 PIECES.`
            : "SELECT ANY OR ALL 15 FLAVORS.";

        document.getElementById("includedSection").classList.toggle(
          "hidden",
          pendingIncludedItems.length === 0
        );

        document.getElementById("includedOptions").innerHTML =
          pendingIncludedItems.map(included => `
            <label class="flavor-option">
              <input type="checkbox" checked disabled>
              <span>${included}</span>
            </label>
          `).join("");

        document.getElementById("dipSection").classList.toggle(
          "hidden",
          !pendingRequiresDip
        );

        document.getElementById("dipChoice").value = item.dip || "";

        document.getElementById("flavorOptions").innerHTML =
          wingFlavors.map(flavor => `
            <label class="flavor-option">

                type="checkbox"
                name="wingFlavor"
                value="${flavor}"
                ${item.flavors.includes(flavor) ? "checked" : ""}

          box.addEventListener("change", updateFlavorSelection);
        });

        document.getElementById("dipChoice").onchange =
          updateFlavorSelection;

        updateFlavorSelection();
      };
    });
  }

  document.getElementById("total").textContent = peso(total);

const paymentMethod =
  document.getElementById("paymentMethod").value;

const cashReceived = Number(
  document.getElementById("cashReceived").value
) || 0;

const change = paymentMethod === "CASH"
  ? Math.max(0, cashReceived - total)
  : 0;

document.getElementById("change").textContent = peso(change);

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[char]);
}

async function loadOrderHistory(){
  const historyEl = document.getElementById("orderHistory");

  historyEl.classList.remove("hidden");
  historyEl.innerHTML = "<p class='small'>Loading orders...</p>";

  try{
    const ordersQuery = query(
      collection(db, "orders"),
      orderBy("createdAt", "desc"),
      limit(50)
    );

    const snapshot = await getDocs(ordersQuery);

    if(snapshot.empty){
      historyEl.innerHTML = "<p class='small'>No orders found.</p>";
      return;
    }

    historyEl.innerHTML = snapshot.docs.map(orderDoc=>{
      const order = orderDoc.data();
      const status = order.status || "COMPLETED";

      return `
        <div class="panel" style="margin-top:12px">
          <div class="row">
            <strong>ORDER #${escapeHTML(order.orderNumber || "LEGACY")}</strong>
<strong>${escapeHTML(status)}</strong>
          </div>

         <p class="small">
  ${escapeHTML(order.customerName || "Walk-in")}<br>
  ${escapeHTML(order.orderDate || "")}
</p>

<div class="small">
  ${(order.items || []).map(item => `
    <p>
      ${escapeHTML(item.name)} × ${Number(item.qty) || 0}
      ${item.flavors?.length ? `<br>Flavors: ${item.flavors.map(escapeHTML).join(", ")}` : ""}
      ${item.dip ? `<br>Dip: ${escapeHTML(item.dip)}` : ""}
    </p>
  `).join("")}
</div>

          <div class="row">
            <strong>TOTAL</strong>
           <strong>${peso(Number(order.total) || 0)}</strong>
</div>

${status !== "VOID" ? `
  <button
    class="secondary"
    data-void="${orderDoc.id}"
    style="width:100%">
    VOID ORDER
  </button>
` : `
  <p class="small">This order has been voided.</p>
  <p class="small">VOID REASON: ${escapeHTML(order.voidReason || "Not provided")}</p>
`}
          </div>
         `;
    }).join("");

    historyEl.querySelectorAll("[data-void]").forEach(button=>{
      button.onclick = async()=>{
        const reason = prompt("Enter the reason for voiding this order:");

        if(reason === null) return;

        if(!reason.trim()){
          alert("Please enter a reason.");
          return;
        }

        if(!confirm("Are you sure you want to VOID this order?")){
          return;
        }

        try{
          await updateDoc(
            doc(db, "orders", button.dataset.void),
            {
              status: "VOID",
              voidReason: reason.trim()
            }
          );

          alert("Order successfully voided.");
          await loadOrderHistory();

        }catch(error){
          console.error("Void order error:", error);
          alert("Unable to void this order. Please try again.");
        }
      };
    });

  }catch(error){
    console.error("Order history error:", error);
    historyEl.innerHTML =
      "<p class='small'>Unable to load order history. Please try again.</p>";
  }
}

async function saveSale(){
  if(isSavingSale || saleSaved) return;

  isSavingSale = true;

  try{
    const discountType = document.getElementById("discount").value;
    const paymentMethod = document.getElementById("paymentMethod").value;

    const subtotal = cart.reduce(
      (sum,item)=>sum + item.price * item.qty, 0
    );

    const eligibleSubtotal = cart
      .filter(item =>
        item.name !== "UNLI 269 WINGS" &&
        item.name !== "UNLI 299 WINGS"
      )
      .reduce((sum,item)=>sum + item.price * item.qty, 0);

    const discountAmount =
      discountType !== "none" && eligibleSubtotal > 0
        ? Math.min(10,eligibleSubtotal)
        : 0;

    const total = subtotal - discountAmount;

    const cashReceived = paymentMethod === "CASH"
      ? Number(document.getElementById("cashReceived").value) || 0
      : 0;

    const change = paymentMethod === "CASH"
      ? cashReceived - total
      : 0;

    if(!pendingSaleRef){
      pendingSaleRef = doc(collection(db,"orders"));
    }

    const today = getTodayDate();
    const counterRef = doc(db,"daily_counters",today);

const sale = {
  orderDate: today,
  status: "COMPLETED",

  customerName:
    document.getElementById("customerName").value.trim() || "Walk-in",

orderType:
  document.querySelector('input[name="orderType"]:checked').value,

items: cart.map(item=>({
        name: item.name,
        price: item.price,
        qty: item.qty,
        flavors: item.flavors || [],
        includedItems: item.includedItems || [],
        dip: item.dip || null
      })),

      subtotal,
      discountType,
      discountAmount,
      total,
      paymentMethod,
      cashReceived,
      change,

      cashierEmail: auth.currentUser.email,
      cashierUid: auth.currentUser.uid,

      createdAt: serverTimestamp()
    };

    const orderNumber = await runTransaction(db, async (transaction)=>{
      const counterSnap = await transaction.get(counterRef);

      const nextNumber = counterSnap.exists()
        ? (counterSnap.data().lastOrderNumber || 0) + 1
        : 1;

      transaction.set(counterRef,{
        date: today,
        lastOrderNumber: nextNumber,
        updatedAt: serverTimestamp()
      });

      transaction.set(pendingSaleRef,{
        ...sale,
        orderNumber: nextNumber
      });

      return nextNumber;
    });

    saleSaved = true;

    document.getElementById("checkoutMessage").textContent =
      "SALE SUCCESSFULLY SAVED! ORDER #" + orderNumber;

    document.getElementById("checkoutButtons").classList.add("hidden");
    document.getElementById("newOrderBtn").classList.remove("hidden");

  }catch(error){
    console.error("Sale saving error:",error);

    document.getElementById("checkoutMessage").textContent =
      "Unable to save sale. Please try again.";
  }finally{
    isSavingSale = false;
  }
}
  async function verifyUser(user){
  const userRef = doc(db,"users",user.uid);
  const userSnap = await getDoc(userRef);

  if(!userSnap.exists()){
    await signOut(auth);
    alert("Access denied: User profile not found.");
    return;
  }

  const profile = userSnap.data();

  if(profile.active !== true ||
     !["owner","cashier"].includes(profile.role)){
    await signOut(auth);
    alert("Access denied: Account is inactive or unauthorized.");
    return;
  }

  document.getElementById("userLabel").textContent =
    user.email + " (" + profile.role.toUpperCase() + ")";

// RESET CURRENT ORDER AFTER LOGIN

pendingSaleRef = null;
document.getElementById("checkoutModal").classList.add("hidden");

onAuthStateChanged(auth,async user=>{
  if(!user){
    document.getElementById("login").classList.remove("hidden");
    document.getElementById("app").classList.add("hidden");
    document.getElementById("userLabel").textContent="POS SYSTEM";
    return;
  }

  try{
    await verifyUser(user);
  }catch(error){
    console.error(error);
    await signOut(auth);
    document.getElementById("loginMessage").textContent=
      "Unable to verify account. Please try again.";
  }
});

document.getElementById("checkoutBtn").onclick=()=>{

      "Please enter the customer name before checkout.";
    document.getElementById("customerName").focus();
    return;
  }

  if(cart.length === 0){
    document.getElementById("orderMessage").textContent=
      "Please add items to the order first.";
    return;
  }

  const paymentMethod =
    document.getElementById("paymentMethod").value;

  if(!paymentMethod){
    document.getElementById("orderMessage").textContent=
      "Please select a payment method.";
    return;
  }

  if(paymentMethod === "CASH"){
    const cashReceived =
      Number(document.getElementById("cashReceived").value) || 0;

    const subtotal = cart.reduce(
      (sum,item)=>sum + item.price * item.qty, 0
    );

    const eligibleSubtotal = cart
      .filter(item =>
        item.name !== "UNLI 269 WINGS" &&
        item.name !== "UNLI 299 WINGS"
      )

    const discountType = document.getElementById("discount").value;

    const discountAmount =
      discountType !== "none" && eligibleSubtotal > 0
        ? Math.min(10,eligibleSubtotal)
